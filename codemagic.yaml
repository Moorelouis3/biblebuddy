# Build the iPhone app on Codemagic's Macs.
#
# GitHub Actions is locked on this account ("your account is locked due to a
# billing issue") and a support ticket is open, but the iOS build should not
# wait on someone else's billing system. Codemagic is a different company
# with its own Macs and a free individual plan - 500 macOS minutes a month,
# which at roughly ten minutes a build is about fifty builds. More than
# enough, and it costs nothing.
#
# .github/workflows/ios-build.yml stays. Whichever unblocks first wins, and
# having two independent ways to compile is worth keeping anyway.
#
# Setup, once: sign in at codemagic.io with GitHub, add this repository, and
# it finds this file on its own. No settings to fill in.

workflows:
  ios-build:
    name: Bible Buddy iOS
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 22
      xcode: latest

    # Manual only. There is no triggering block on purpose.
    #
    # Two routines commit to main all day - the hourly Bible notes writer and
    # the chapter library - and Codemagic has no working path filter for this.
    # A changeset filter was tried on 2026-10-13 and did not skip: commit
    # d5bef2b ("Chapter library: start Exodus 29") still queued a full iOS
    # build. With cancel_previous_builds on, each of those also killed the
    # build queued behind it, so the one that mattered never ran. With it off,
    # every chapter of notes would instead burn three minutes of a 500 minute
    # monthly allowance - about 144 minutes a day, so the free plan would be
    # gone inside a week.
    #
    # Builds are started by hand from codemagic.io, which is the right shape
    # anyway: the iOS shell only changes when someone deliberately changes it.

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        # ios/ is gitignored - it is generated output, so it is rebuilt here
        # rather than drifting out of step with capacitor.config.ts.
        script: npx cap add ios

      - name: Sync web assets and plugins
        script: npx cap sync ios

      - name: Raise the project to iOS 16
        # The Bible lock plugin needs 16, and Swift Package Manager will not
        # resolve a graph where the app asks for less than a package it
        # depends on. Without this xcodebuild cannot read the project at all.
        script: bash scripts/ios-deployment-target.sh

      - name: Write the Info.plist keys Apple requires
        script: bash scripts/ios-info-plist.sh

      - name: Give the app the Sign in with Apple entitlement
        # Guideline 4.8 - mandatory because Google sign-in is offered. iOS will
        # not present the Apple sheet without this, whatever Supabase says.
        script: bash scripts/ios-entitlements.sh

      # The re-lock extension is OFF until its two real problems are fixed
      # (2026-10-17). With package resolution finally working, the archive
      # got far enough to say what is actually wrong with it:
      #
      #   error: Multiple commands produce '.../UninstalledProducts/
      #   iphoneos/.appex'
      #
      # - the product name is empty, so the extension builds as '.appex'
      # with nothing in front of it, and the embed phase adds it twice. The
      # ruby in scripts/ios-bible-lock-extension.sh never sets PRODUCT_NAME.
      #
      #   error: "BibleLockMonitor" requires a provisioning profile with the
      #   App Groups and Family Controls (Development) features
      #
      # - and that one is not code at all. The extension's bundle id,
      # net.mybiblebuddy.app.biblelockmonitor, needs App Groups and Family
      # Controls switched on in the developer portal before any profile can
      # carry them. That is Louis's to do in his Apple account.
      #
      # Bible Lock still works without it: choosing apps, locking them and
      # the lock lifting when the reading is done are all in the plugin.
      # What is missing is the re-lock on a day nobody opens the app.
      #
      # - name: Add the Bible lock's daily re-lock extension
      #   script: bash scripts/ios-bible-lock-extension.sh

      - name: Install the app icon
        # Otherwise the app wears Capacitor's grey placeholder everywhere -
        # home screen, TestFlight, and the store listing.
        script: bash scripts/ios-app-icon.sh

      - name: Show which plugins linked
        script: npx cap ls ios

      - name: Run it in a simulator and photograph what happens
        # Builds, installs, launches and screenshots. "It compiles" was never
        # the same as "it runs", and until this step existed nobody had seen
        # Bible Buddy open as an app at all.
        script: bash scripts/ios-simulator-run.sh

    artifacts:
      # The point of the whole build: pictures of the app running, and the
      # device log that explains a white screen when there is one.
      - build/simulator-screenshots/*.png
      - build/simulator-screenshots/*.txt
      # So the generated project can be read without a Mac: Info.plist, and
      # Package.swift listing which plugin versions Capacitor linked.
      - ios/App/App/Info.plist
      - ios/App/Package.swift
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - moorelouis3@gmail.com
        # A green build now carries screenshots of the app actually running,
        # which is worth opening rather than filtering.
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # The signed build: what actually puts Bible Buddy on a phone.
  #
  # Manual only - no `triggering` block - because it costs real minutes and
  # burns a TestFlight build number every run.
  #
  # ONE SETUP STEP, and it is the only thing left that an agent cannot do,
  # because it means handling a secret:
  #
  #   1. App Store Connect → Users and Access → Integrations →
  #      App Store Connect API → generate a key with the App Manager role.
  #      The .p8 downloads ONCE. Keep it.
  #   2. Codemagic → Teams/Personal Account → Integrations →
  #      Developer Portal → Connect. Paste the Issuer ID, the Key ID and the
  #      .p8 contents. Name the integration exactly:  BibleBuddy ASC
  #   3. Run this workflow.
  #
  # After that Codemagic creates the certificate and provisioning profile
  # itself, so no certificates ever touch Louis's Windows machine.
  ios-release:
    name: Bible Buddy iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: BibleBuddy ASC

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "net.mybiblebuddy.app"
        # The version people see is "<this>.<build>" - 1.09 is version 1,
        # build 9 (Louis, 2026-10-17: "so I know it's version 1 build 9").
        # Bump it to 2 when version 2 ships and the numbers read 2.14, 2.15.
        APP_MAJOR_VERSION: "1"
        # Asked what the last build to actually reach TestFlight was, so a
        # failed attempt never spends a number.
        APP_STORE_APP_ID: "6822155944"
      # This needs a certificate to exist in the team's code signing
      # identities, and on 2026-10-13 it did not, which cost two builds:
      #   #1 died before any step ran - "No matching profiles found".
      #   #2 got all the way to the archive and failed with "App requires a
      #      provisioning profile", because the real problem was upstream:
      #      "Cannot save Signing Certificates without certificate private
      #      key". Apple had issued a certificate but nothing held its key.
      # Fixed by generating one in Codemagic (Settings > Code signing
      # identities > Generate certificate, "BibleBuddy Distribution"), which
      # keeps the private key. Codemagic installs it into the build keychain
      # and creates the missing provisioning profile from the API key below.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.mybiblebuddy.app

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        script: npx cap add ios

      - name: Sync web assets and plugins
        script: npx cap sync ios

      - name: Raise the project to iOS 16
        # The Bible lock plugin needs 16, and Swift Package Manager will not
        # resolve a graph where the app asks for less than a package it
        # depends on. Without this xcodebuild cannot read the project at all.
        script: bash scripts/ios-deployment-target.sh

      - name: Write the Info.plist keys Apple requires
        script: bash scripts/ios-info-plist.sh

      - name: Give the app the Sign in with Apple entitlement
        # Guideline 4.8 - mandatory because Google sign-in is offered. iOS will
        # not present the Apple sheet without this, whatever Supabase says.
        script: bash scripts/ios-entitlements.sh

      # The re-lock extension is OFF until its two real problems are fixed
      # (2026-10-17). With package resolution finally working, the archive
      # got far enough to say what is actually wrong with it:
      #
      #   error: Multiple commands produce '.../UninstalledProducts/
      #   iphoneos/.appex'
      #
      # - the product name is empty, so the extension builds as '.appex'
      # with nothing in front of it, and the embed phase adds it twice. The
      # ruby in scripts/ios-bible-lock-extension.sh never sets PRODUCT_NAME.
      #
      #   error: "BibleLockMonitor" requires a provisioning profile with the
      #   App Groups and Family Controls (Development) features
      #
      # - and that one is not code at all. The extension's bundle id,
      # net.mybiblebuddy.app.biblelockmonitor, needs App Groups and Family
      # Controls switched on in the developer portal before any profile can
      # carry them. That is Louis's to do in his Apple account.
      #
      # Bible Lock still works without it: choosing apps, locking them and
      # the lock lifting when the reading is done are all in the plugin.
      # What is missing is the re-lock on a day nobody opens the app.
      #
      # - name: Add the Bible lock's daily re-lock extension
      #   script: bash scripts/ios-bible-lock-extension.sh

      - name: Install the app icon
        script: bash scripts/ios-app-icon.sh

      - name: Set the version and build number
        # Apple rejects a build whose number it has seen before, and the
        # error arrives after the upload rather than before it. $BUILD_NUMBER
        # is Codemagic's own counter, so it always goes up.
        #
        # The marketing version carries the build in it: 1.09 is version 1,
        # build 9, so TestFlight's own list says which build you are holding
        # without reading the small number beside it (Louis, 2026-10-17). It
        # was a flat 1.0 on every build before this one.
        #
        # Padded to two digits so Apple's numeric comparison still rises:
        # 1.09 then 1.10 is nine then ten, and after 1.99 comes 1.100.
        #
        # The number comes from TestFlight, NOT from $BUILD_NUMBER. Codemagic's
        # counter moves on every attempt, so two failures spent 9 and 10 on
        # nothing and the next good build would have called itself 1.11 of an
        # app whose last real build was 8 (Louis, 2026-10-17: "don't call it
        # build 10 or 11, it failed - we are build 9 until it is successful").
        # Asking Apple what actually landed makes a failure cost nothing.
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
          case "$LATEST" in
            ''|*[!0-9]*)
              # Apple unreachable or no build yet: fall back to Codemagic's
              # counter, which is always higher than anything uploaded, so the
              # upload cannot collide even on the odd run.
              NEXT="$BUILD_NUMBER"
              echo "No TestFlight build number available - falling back to $NEXT."
              ;;
            *) NEXT=$((LATEST + 1)) ;;
          esac
          echo "Building as ${APP_MAJOR_VERSION:-1}.$(printf "%02d" "$NEXT") (build $NEXT)."
          agvtool new-marketing-version "${APP_MAJOR_VERSION:-1}.$(printf "%02d" "$NEXT")"
          agvtool new-version -all "$NEXT"

      # The Bible lock extension used to fetch its own signing here, on the
      # assumption that ios_signing only covered net.mybiblebuddy.app. It does
      # not: Codemagic matches the id AND its children, so
      # net.mybiblebuddy.app.biblelockmonitor was already handled.
      #
      # The step was not merely redundant, it could never pass. Called by
      # hand, app-store-connect fetches certificates from Apple and tries to
      # save them, and Apple hands over a certificate without its private key
      # - "Cannot save Signing Certificates without certificate private key",
      # which is what killed build 9 (2026-10-17) and build 2 before it. Only
      # the certificate generated inside Codemagic has a key it can use, and
      # the ios_signing integration is the thing that knows that.

      - name: Point Xcode at the signing files
        # Codemagic has already put the certificate and profile on the
        # machine by this point; this writes them into the Xcode project,
        # which is generated and therefore starts with no signing at all.
        script: xcode-project use-profiles

      - name: Show why the project will not open
        # xcode-project build-ipa swallows xcodebuild's own output and prints
        # only "Failed to show build settings", which has now cost four builds
        # of guessing (2026-10-17). This runs the same commands by hand so the
        # real reason is in the log. It can never fail the build itself.
        script: |
          set +e
          echo "--- schemes and targets ---"
          xcodebuild -project ios/App/App.xcodeproj -list 2>&1 | tail -40
          echo "--- package resolution ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies 2>&1 | tail -40
          echo "--- build settings ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | tail -60
          exit 0
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The binary lands in TestFlight and internal testers
        # can install it straight away.
        #
        # submit_to_testflight does something else than its name suggests: it
        # asks Apple for *beta review*, which only external testers need. Apple
        # allows one build per train in beta review at a time, so with it on,
        # every build made while an earlier one is still in review ends as
        # "post-processing failed" - build 7 did, with a perfectly good ipa
        # already on App Store Connect. Turn it back on the day external
        # testers are added.
        submit_to_testflight: false
        submit_to_app_store: false

      email:
        recipients:
          - moorelouis3@gmail.com
        notify:
          success: true
          failure: true
