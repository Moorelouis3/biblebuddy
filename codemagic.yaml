# Build the iPhone app on Codemagic's Macs.
#
# GitHub Actions is locked on this account ("your account is locked due to a
# billing issue") and a support ticket is open, but the iOS build should not
# wait on someone else's billing system. Codemagic is a different company
# with its own Macs and a free individual plan - 500 macOS minutes a month,
# which at roughly ten minutes a build is about fifty builds. More than
# enough, and it costs nothing.
#
# .github/workflows/ios-build.yml stays. Whichever unblocks first wins, and
# having two independent ways to compile is worth keeping anyway.
#
# Setup, once: sign in at codemagic.io with GitHub, add this repository, and
# it finds this file on its own. No settings to fill in.

workflows:
  ios-build:
    name: Bible Buddy iOS
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 22
      xcode: latest
      vars:
        # ON here too, and this is not cosmetic (2026-10-26).
        #
        # This workflow adds the Bible Lock extension, which compiles the
        # Screen Time APIs into the app, but it never set this - and
        # scripts/ios-entitlements.sh defaults to off. So a build from here
        # ships Screen Time code with no Family Controls entitlement, which
        # is precisely what Apple's automated review rejects:
        #
        #   "An automated analysis indicates the app uses one or more Screen
        #   Time APIs but the app has not been submitted with the Family
        #   Controls entitlement."
        #
        # It did not cause the 2026-10-26 rejection - that build came from
        # ios-release, which does set it - but only because this workflow
        # does not upload. Either both carry the entitlement or neither
        # compiles the APIs; a split between them is a trap.
        BIBLE_LOCK_ENTITLEMENT: "on"

    # Manual only. There is no triggering block on purpose.
    #
    # Two routines commit to main all day - the hourly Bible notes writer and
    # the chapter library - and Codemagic has no working path filter for this.
    # A changeset filter was tried on 2026-10-13 and did not skip: commit
    # d5bef2b ("Chapter library: start Exodus 29") still queued a full iOS
    # build. With cancel_previous_builds on, each of those also killed the
    # build queued behind it, so the one that mattered never ran. With it off,
    # every chapter of notes would instead burn three minutes of a 500 minute
    # monthly allowance - about 144 minutes a day, so the free plan would be
    # gone inside a week.
    #
    # Builds are started by hand from codemagic.io, which is the right shape
    # anyway: the iOS shell only changes when someone deliberately changes it.

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        # ios/ is gitignored - it is generated output, so it is rebuilt here
        # rather than drifting out of step with capacitor.config.ts.
        script: npx cap add ios

      - name: Sync web assets and plugins
        script: npx cap sync ios

      - name: Raise the project to iOS 16
        # The Bible lock plugin needs 16, and Swift Package Manager will not
        # resolve a graph where the app asks for less than a package it
        # depends on. Without this xcodebuild cannot read the project at all.
        script: bash scripts/ios-deployment-target.sh

      - name: Forward the APNs token to Capacitor
        # Apple hands the device token to the AppDelegate and nowhere
        # else, and the generated AppDelegate does not pass it on - so
        # every build so far received a token and silently dropped it.
        # native_push_tokens has held zero rows since the day it was
        # created. See the script.
        script: bash scripts/ios-push-appdelegate.sh

      - name: Write the Info.plist keys Apple requires
        script: bash scripts/ios-info-plist.sh

      - name: Give the app the Sign in with Apple entitlement
        # Guideline 4.8 - mandatory because Google sign-in is offered. iOS will
        # not present the Apple sheet without this, whatever Supabase says.
        script: bash scripts/ios-entitlements.sh

      - name: Add the Bible lock's daily re-lock extension
        # The lock has to come back at the start of each day whether or not
        # anyone opens Bible Buddy, and only a DeviceActivityMonitor extension
        # gets woken for that. ios/ is regenerated every build, so the second
        # target is added here rather than committed.
        #
        # Back on 2026-10-17 with both of its problems fixed: PRODUCT_NAME is
        # set, so the product is no longer built as ".appex" with nothing in
        # front of it, and net.mybiblebuddy.app.biblelockmonitor finally has a
        # provisioning profile - made by hand and committed beside the app's,
        # carrying App Groups and Family Controls.
        script: bash scripts/ios-bible-lock-extension.sh

      - name: Install the app icon
        # Otherwise the app wears Capacitor's grey placeholder everywhere -
        # home screen, TestFlight, and the store listing.
        script: bash scripts/ios-app-icon.sh

      - name: Show which plugins linked
        script: npx cap ls ios

      - name: Run it in a simulator and photograph what happens
        # Builds, installs, launches and screenshots. "It compiles" was never
        # the same as "it runs", and until this step existed nobody had seen
        # Bible Buddy open as an app at all.
        script: bash scripts/ios-simulator-run.sh

    artifacts:
      # The point of the whole build: pictures of the app running, and the
      # device log that explains a white screen when there is one.
      - build/simulator-screenshots/*.png
      - build/simulator-screenshots/*.txt
      # So the generated project can be read without a Mac: Info.plist, and
      # Package.swift listing which plugin versions Capacitor linked.
      - ios/App/App/Info.plist
      - ios/App/Package.swift
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - moorelouis3@gmail.com
        # A green build now carries screenshots of the app actually running,
        # which is worth opening rather than filtering.
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # The signed build: what actually puts Bible Buddy on a phone.
  #
  # Manual only - no `triggering` block - because it costs real minutes and
  # burns a TestFlight build number every run.
  #
  # ONE SETUP STEP, and it is the only thing left that an agent cannot do,
  # because it means handling a secret:
  #
  #   1. App Store Connect → Users and Access → Integrations →
  #      App Store Connect API → generate a key with the App Manager role.
  #      The .p8 downloads ONCE. Keep it.
  #   2. Codemagic → Teams/Personal Account → Integrations →
  #      Developer Portal → Connect. Paste the Issuer ID, the Key ID and the
  #      .p8 contents. Name the integration exactly:  BibleBuddy ASC
  #   3. Run this workflow.
  #
  # After that Codemagic creates the certificate and provisioning profile
  # itself, so no certificates ever touch Louis's Windows machine.
  ios-release:
    name: Bible Buddy iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: BibleBuddy ASC

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "net.mybiblebuddy.app"
        # OFF, with proof (2026-10-17). The profile Apple generates for this
        # App ID does not carry com.apple.developer.family-controls - and does
        # not carry com.apple.security.application-groups either, though both
        # are ticked on the identifier and the entitlement reads Assigned.
        # Decoded from the .mobileprovision on the build machine, after
        # regenerating the profile twice and then deleting it so Apple made a
        # brand new one. Same result every time.
        #
        # An app asking for an entitlement its profile lacks cannot be signed,
        # so this stays off until Apple issues a profile that has it. See
        # docs/bible-lock-entitlement-evidence.md.
        BIBLE_LOCK_ENTITLEMENT: "on"
        # The version people see is "<this>.<build>" - 1.09 is version 1,
        # build 9 (Louis, 2026-10-17: "so I know it's version 1 build 9").
        # Bump it to 2 when version 2 ships and the numbers read 2.14, 2.15.
        APP_MAJOR_VERSION: "1"
        # Asked what the last build to actually reach TestFlight was, so a
        # failed attempt never spends a number.
        APP_STORE_APP_ID: "6822155944"
      # This needs a certificate to exist in the team's code signing
      # identities, and on 2026-10-13 it did not, which cost two builds:
      #   #1 died before any step ran - "No matching profiles found".
      #   #2 got all the way to the archive and failed with "App requires a
      #      provisioning profile", because the real problem was upstream:
      #      "Cannot save Signing Certificates without certificate private
      #      key". Apple had issued a certificate but nothing held its key.
      # Fixed by generating one in Codemagic (Settings > Code signing
      # identities > Generate certificate, "BibleBuddy Distribution"), which
      # keeps the private key. Codemagic installs it into the build keychain
      # and creates the missing provisioning profile from the API key below.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.mybiblebuddy.app

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        script: npx cap add ios

      - name: Sync web assets and plugins
        script: npx cap sync ios

      - name: Raise the project to iOS 16
        # The Bible lock plugin needs 16, and Swift Package Manager will not
        # resolve a graph where the app asks for less than a package it
        # depends on. Without this xcodebuild cannot read the project at all.
        script: bash scripts/ios-deployment-target.sh

      - name: Forward the APNs token to Capacitor
        # Apple hands the device token to the AppDelegate and nowhere
        # else, and the generated AppDelegate does not pass it on - so
        # every build so far received a token and silently dropped it.
        # native_push_tokens has held zero rows since the day it was
        # created. See the script.
        script: bash scripts/ios-push-appdelegate.sh

      - name: Write the Info.plist keys Apple requires
        script: bash scripts/ios-info-plist.sh

      - name: Give the app the Sign in with Apple entitlement
        # Guideline 4.8 - mandatory because Google sign-in is offered. iOS will
        # not present the Apple sheet without this, whatever Supabase says.
        script: bash scripts/ios-entitlements.sh

      - name: Add the Bible lock's daily re-lock extension
        # The lock has to come back at the start of each day whether or not
        # anyone opens Bible Buddy, and only a DeviceActivityMonitor extension
        # gets woken for that. ios/ is regenerated every build, so the second
        # target is added here rather than committed.
        #
        # Back on 2026-10-17 with both of its problems fixed: PRODUCT_NAME is
        # set, so the product is no longer built as ".appex" with nothing in
        # front of it, and net.mybiblebuddy.app.biblelockmonitor finally has a
        # provisioning profile - made by hand and committed beside the app's,
        # carrying App Groups and Family Controls.
        script: bash scripts/ios-bible-lock-extension.sh

      - name: Install the app icon
        script: bash scripts/ios-app-icon.sh

      - name: Set the version and build number
        # Apple rejects a build whose number it has seen before, and the
        # error arrives after the upload rather than before it. $BUILD_NUMBER
        # is Codemagic's own counter, so it always goes up.
        #
        # The marketing version carries the build in it: 1.09 is version 1,
        # build 9, so TestFlight's own list says which build you are holding
        # without reading the small number beside it (Louis, 2026-10-17). It
        # was a flat 1.0 on every build before this one.
        #
        # Padded to two digits so Apple's numeric comparison still rises:
        # 1.09 then 1.10 is nine then ten, and after 1.99 comes 1.100.
        #
        # The number comes from TestFlight, NOT from $BUILD_NUMBER. Codemagic's
        # counter moves on every attempt, so two failures spent 9 and 10 on
        # nothing and the next good build would have called itself 1.11 of an
        # app whose last real build was 8 (Louis, 2026-10-17: "don't call it
        # build 10 or 11, it failed - we are build 9 until it is successful").
        # Asking Apple what actually landed makes a failure cost nothing.
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
          case "$LATEST" in
            ''|*[!0-9]*)
              # Apple unreachable or no build yet: fall back to Codemagic's
              # counter, which is always higher than anything uploaded, so the
              # upload cannot collide even on the odd run.
              NEXT="$BUILD_NUMBER"
              echo "No TestFlight build number available - falling back to $NEXT."
              ;;
            *) NEXT=$((LATEST + 1)) ;;
          esac
          echo "Building as ${APP_MAJOR_VERSION:-1}.$(printf "%02d" "$NEXT") (build $NEXT)."
          agvtool new-marketing-version "${APP_MAJOR_VERSION:-1}.$(printf "%02d" "$NEXT")"
          agvtool new-version -all "$NEXT"

      # The Bible lock extension used to fetch its own signing here, on the
      # assumption that ios_signing only covered net.mybiblebuddy.app. It does
      # not: Codemagic matches the id AND its children, so
      # net.mybiblebuddy.app.biblelockmonitor was already handled.
      #
      # The step was not merely redundant, it could never pass. Called by
      # hand, app-store-connect fetches certificates from Apple and tries to
      # save them, and Apple hands over a certificate without its private key
      # - "Cannot save Signing Certificates without certificate private key",
      # which is what killed build 9 (2026-10-17) and build 2 before it. Only
      # the certificate generated inside Codemagic has a key it can use, and
      # the ios_signing integration is the thing that knows that.

      - name: Install the real provisioning profile
        # Codemagic fetches a stale one that carries no entitlements at all.
        # Apple's own file does; it travels with the repo. See the script.
        script: bash scripts/ios-install-profile.sh
      - name: Point Xcode at the signing files
        # Codemagic has already put the certificate and profile on the
        # machine by this point; this writes them into the Xcode project,
        # which is generated and therefore starts with no signing at all.
        script: xcode-project use-profiles

      - name: Show why the project will not open
        # xcode-project build-ipa swallows xcodebuild's own output and prints
        # only "Failed to show build settings", which has now cost four builds
        # of guessing (2026-10-17). This runs the same commands by hand so the
        # real reason is in the log. It can never fail the build itself.
        script: |
          set +e
          echo "--- schemes and targets ---"
          xcodebuild -project ios/App/App.xcodeproj -list 2>&1 | tail -40
          echo "--- package resolution ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies 2>&1 | tail -40
          echo "--- build settings ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | tail -20
          # The archive is where it dies now, and build-ipa swallows this too.
          # What is ACTUALLY inside the profile Codemagic fetched. The portal
          # says the capability is enabled and the entitlement is Assigned, and
          # the archive says the profile does not carry it - only the file
          # settles that (2026-10-17).
          echo "--- profiles on this machine ---"
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            [ -e "$f" ] || continue
            echo "profile: $f"
            security cms -D -i "$f" 2>/dev/null \
              | plutil -p - 2>/dev/null \
              | grep -iE "\"Name\"|application-identifier|family-controls|application-groups|get-task-allow" || true
          done
          echo "--- archive ---"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/diagnostic.xcarchive \
            archive 2>&1 | grep -iE "error|warning: .*sign|provisioning|entitle|Signing|CodeSign|failed" | tail -40
          exit 0
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The binary lands in TestFlight and internal testers
        # can install it straight away.
        #
        # submit_to_testflight does something else than its name suggests: it
        # asks Apple for *beta review*, which only external testers need. Apple
        # allows one build per train in beta review at a time, so with it on,
        # every build made while an earlier one is still in review ends as
        # "post-processing failed" - build 7 did, with a perfectly good ipa
        # already on App Store Connect. Turn it back on the day external
        # testers are added.
        submit_to_testflight: false
        submit_to_app_store: false

      email:
        recipients:
          - moorelouis3@gmail.com
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # Android. A separate workflow from the iOS one because nothing here needs
  # Xcode and a failed Android build should not cost an iOS build its place.
  #
  # It runs on mac_mini_m2, not Linux, and that was not the plan. The plan said
  # Linux - cheaper per minute, and the free plan's 500 minutes are macOS ones
  # the iPhone build is already spending. Tried on 2026-10-25 and Codemagic
  # refused the build outright: "The selected instance type is not available
  # with the current billing plan." Linux instances need a paid subscription;
  # the free tier is macOS only. So Android shares the 500 macOS minutes until
  # somebody decides to pay, and the emulator step picks its system image by
  # architecture because this machine is Apple Silicon.
  #
  # Manual only, no `triggering` block, for the same reason the iOS workflows
  # have none: two routines commit to main all day - the hourly Bible notes
  # writer and the chapter library - and a changeset filter was tried on
  # 2026-10-13 and did not skip. The shell only changes when somebody
  # deliberately changes it.
  #
  # This workflow proves the thing compiles, installs and opens. The signed
  # bundle that actually goes to Play is android-release, below.
  android-build:
    name: Bible Buddy Android
    instance_type: mac_mini_m2
    max_build_duration: 40

    environment:
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the Android project
        # android/ is gitignored exactly as ios/ is - it is generated output,
        # rebuilt here rather than left to drift out of step with
        # capacitor.config.ts. @capacitor/android is a RUNTIME dependency for
        # this reason: `npx cap add` reads the platform out of node_modules,
        # and a --omit=dev install would not have it.
        script: npx cap add android

      - name: Sync web assets and plugins
        script: npx cap sync android

      - name: Show the target API level
        # Play has required targetSdk 36 for new submissions since 31 August
        # 2026. Capacitor 8 already sets it, and this prints it rather than
        # enforcing it - a wrong value fails at upload, hours later, with an
        # error that does not mention this file. Here it is one line in the
        # log.
        script: |
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle

      - name: Install the app icon
        # Otherwise the app wears Capacitor's grey placeholder on the home
        # screen and in the Play listing. Android needs an adaptive icon - two
        # layers, cropped to whatever shape the launcher uses - so this is a
        # real script rather than the one-line copy the iOS build does.
        script: node scripts/android-app-icon.mjs

      - name: Show which plugins linked
        script: npx cap ls android

      - name: Run it in an emulator and photograph what happens
        # Builds, installs, launches and screenshots. The iPhone build went
        # nine rounds before anybody saw the app open; this one does not have
        # to.
        script: bash scripts/android-emulator-run.sh

    artifacts:
      # The point of the whole build: pictures of the app running, and the
      # log that explains a white screen when there is one.
      - build/emulator-screenshots/*.png
      - build/emulator-screenshots/*.txt
      - build/emulator-screenshots/*.log
      - android/app/build/outputs/apk/debug/*.apk
      # So the generated project can be read without an Android machine.
      - android/app/src/main/AndroidManifest.xml
      - android/variables.gradle

    publishing:
      email:
        recipients:
          - moorelouis3@gmail.com
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # The signed Android build: what produces the .aab that goes to Play, and so
  # the thing that produces the tester opt-in link. Nothing can be asked of a
  # tester until a bundle from here is sitting on a closed track.
  #
  # ONE SETUP STEP, and like the iOS one it is the only thing an agent cannot
  # do, because it means holding a secret:
  #
  #   1. Codemagic → Teams/Personal Account → Code signing identities →
  #      Android keystores → Generate keystore (or upload one).
  #   2. Name the reference exactly:  BibleBuddy Upload
  #   3. Run this workflow.
  #
  # Codemagic keeps the keystore and exports CM_KEYSTORE_PATH and friends into
  # the build; scripts/android-release-config.mjs wires those into the
  # generated gradle file. Nothing secret is ever committed here.
  #
  # LOSE THAT KEYSTORE AND THE LISTING IS DEAD. Google signs the app you ship
  # with its own key, but it only accepts uploads signed with this one, and
  # there is no self-service way back. Download a copy out of Codemagic the
  # day it is created and put it somewhere that is not one laptop.
  #
  # Manual only, same as every other workflow in this file.
  android-release:
    name: Bible Buddy Android — signed bundle
    instance_type: mac_mini_m2
    max_build_duration: 40

    environment:
      node: 22
      java: 21
      android_signing:
        - BibleBuddy Upload
      vars:
        # The version people see is "<this>.<build>" - 1.09 is version 1,
        # build 9, matching the iPhone build's convention so the two stores
        # do not drift into different numbering.
        APP_MAJOR_VERSION: "1"

    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund

      - name: Generate the Android project
        script: npx cap add android

      - name: Sync web assets and plugins
        script: npx cap sync android

      - name: Install the app icon
        script: node scripts/android-app-icon.mjs

      - name: Set the version and wire up signing
        # versionCode has to rise on every upload or Play rejects the bundle
        # after it has already been transferred. $BUILD_NUMBER is Codemagic's
        # own counter, so it always does.
        script: node scripts/android-release-config.mjs

      - name: Build the app bundle
        # bundleRelease, not assembleRelease: Play wants an .aab. An .apk is
        # only good for sideloading onto a test device.
        script: cd android && ./gradlew --no-daemon bundleRelease

      - name: Show what came out
        script: |
          ls -la android/app/build/outputs/bundle/release/
          grep -E "versionCode|versionName" android/app/build.gradle

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    # No `publishing: google_play:` block yet. Uploading straight from CI needs
    # a service account JSON from the Play Console, and the Console will not
    # issue one until the account's identity checks clear and an app exists.
    # The first bundle gets uploaded by hand; automate it after that.
    publishing:
      email:
        recipients:
          - moorelouis3@gmail.com
        notify:
          success: true
          failure: true
