# One-off diagnostic (2026-10-11).
#
# Every iOS build dies in under 10 seconds with "The job was not started
# because your account is locked due to a billing issue", while the billing
# pages show GitHub Free, nothing owed and 0 of 2,000 minutes used.
#
# This tells the two possible causes apart:
#   - both jobs fail  -> the account really is locked, and only GitHub
#                        Support can lift it
#   - only macos fails -> the account is fine and something specific to
#                        macOS runners is refusing, which is a different
#                        conversation entirely
#
# Delete this once the answer is known.

name: Runner check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner-check.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linux runner started fine."

  mac:
    runs-on: macos-latest
    steps:
      - run: echo "macOS runner started fine."
