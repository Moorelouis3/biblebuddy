<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Bible Buddy</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(16px + env(safe-area-inset-left)) 24px calc(16px + env(safe-area-inset-right));
    background: #f3f6fa; color: #17233b;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 22rem; }
  .mark { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #5268a7; margin: 0 0 18px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; }
  p { color: #4a5568; margin: 0 0 20px; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: #334f91;
    border: 0; border-radius: 10px; padding: 13px 26px; cursor: pointer;
  }
  button:active { opacity: .85; }
  @media (prefers-color-scheme: dark) {
    body { background: #11161f; color: #e8edf5; }
    p { color: #9fb0c7; }
  }
</style>
</head>
<body>
<main>
  <p class="mark">BIBLE BUDDY</p>
  <h1>You're offline</h1>
  <p>My Bible Buddy needs a connection for this page. Anything you've saved for offline reading is still available.</p>
  <button type="button" onclick="location.replace('https://www.mybiblebuddy.net')">Try again</button>
</main>
</body>
</html>
