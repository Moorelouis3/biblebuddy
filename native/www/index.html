<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Buddy</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(16px + env(safe-area-inset-left)) 24px calc(16px + env(safe-area-inset-right));
    background: #f3f6fa; color: #17233b;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 22rem; }
  .mark { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #5268a7; margin: 0 0 18px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; }
  p { color: #4a5568; margin: 0 0 20px; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: #334f91;
    border: 0; border-radius: 10px; padding: 13px 26px; cursor: pointer;
  }
  button:active { opacity: .85; }
  @media (prefers-color-scheme: dark) {
    body { background: #11161f; color: #e8edf5; }
    p { color: #9fb0c7; }
  }
</style>
</head>
<body>
<main>
  <p class="mark">BIBLE BUDDY</p>
  <h1>You're offline</h1>
  <p>Bible Buddy needs a connection for this page. Anything you've saved for offline reading is still available.</p>
  <button id="retry" type="button">Try again</button>
<script>
  // Retrying used to jump to the marketing homepage, which lost your place
  // and, on a phone that is still offline, simply landed back here.
  //
  // Now it reloads whatever you were actually on, and only falls back to the
  // app's own entry if there is nothing to go back to. The button also waits
  // for the connection instead of failing again the instant you press it.
  (function () {
    var HOME = "https://www.mybiblebuddy.net/app";
    var btn = document.getElementById("retry");

    function retry() {
      if (!navigator.onLine) {
        btn.textContent = "Still offline";
        setTimeout(function () { btn.textContent = "Try again"; }, 1600);
        return;
      }
      btn.textContent = "Reconnecting...";
      btn.disabled = true;
      if (history.length > 1) { history.back(); return; }
      location.replace(HOME);
    }

    btn.addEventListener("click", retry);
    // Come back on its own the moment the phone has a connection again.
    window.addEventListener("online", retry);
  })();
</script>
</main>
</body>
</html>
